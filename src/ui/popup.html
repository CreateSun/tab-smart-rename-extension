<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tab Rename</title><link rel="stylesheet" href="styles.css"></head>
<body class="popup">
  <main>
    <header><div><p class="eyebrow">TAB RENAME</p><h1>给标签一个好名字</h1></div><button id="manage" class="icon-button" title="管理规则" aria-label="管理规则">⚙</button></header>
    <section id="loading" class="empty">正在读取当前页面…</section>
    <form id="form" hidden>
      <div class="context"><span id="source" class="badge"></span><p id="original" class="truncate"></p></div>
      <label for="name">标签名称</label><input id="name" maxlength="256" autocomplete="off" required>
      <fieldset><legend>作用范围</legend>
        <label class="choice"><input type="radio" name="mode" value="page"><span><strong>仅当前页面</strong><small>刷新或导航后消失</small></span></label>
        <label class="choice"><input type="radio" name="mode" value="tab" checked><span><strong>当前标签</strong><small>刷新和导航后保留，关闭标签后消失</small></span></label>
        <label class="choice"><input type="radio" name="mode" value="permanent"><span><strong>永久规则</strong><small>以后匹配的页面自动应用</small></span></label>
      </fieldset>
      <fieldset id="scopeBox" hidden><legend>永久规则匹配</legend><div class="inline"><label><input type="radio" name="scope" value="exact-url" checked> 精确 URL</label><label><input type="radio" name="scope" value="host"> 整个域名</label></div></fieldset>
      <p id="error" class="error" role="alert"></p>
      <div class="actions"><button type="button" id="restore" class="secondary">恢复原标题</button><button type="submit">保存</button></div>
    </form>
  </main><script src="popup.js"></script>
</body></html>
