<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>欢迎使用 Tab Rename</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="onboarding"><p class="eyebrow">WELCOME TO TAB RENAME</p><h1>标签名，由你决定。</h1><p class="lead">快速区分相似页面，同时清楚知道名称会保留多久。</p><div class="cards"><article><strong>仅当前页面</strong><p>适合临时备注。刷新或导航后消失。</p></article><article><strong>当前标签</strong><p>默认模式。刷新与导航后仍保留，关闭标签后消失。</p></article><article><strong>永久规则</strong><p>按精确 URL 或域名匹配未来页面。</p></article></div><section class="notice"><h2>打开方式</h2><p>点击工具栏图标，或按 <kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>R</kbd>。可在 <code>chrome://extensions/shortcuts</code> 修改快捷键。</p><p>受浏览器保护的页面无法修改。所有数据只保存在本机，不上传、不遥测。</p></section><button id="start">开始使用</button></main><script src="onboarding.js"></script></body></html>
