<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf5ef"/><stop offset="1" stop-color="#f5e9c9"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dy="16" stdDeviation="18" flood-color="#245236" flood-opacity=".12"/></filter></defs>
  <rect width="1280" height="800" fill="url(#b)"/><circle cx="-60" cy="-80" r="300" fill="#c8ead4" opacity=".65"/><circle cx="1350" cy="850" r="310" fill="#f4d99e" opacity=".63"/>
  <rect x="112" y="53" width="1056" height="694" rx="30" fill="#fffffbe8" filter="url(#sh)"/><rect x="112" y="53" width="1056" height="694" rx="30" fill="none" stroke="#d2dfd4"/>
  <rect x="154" y="91" width="35" height="35" rx="11" fill="#176c45"/><path d="M165 109h8l5 5h-13z" fill="#f7f2e7"/><text x="204" y="114" fill="#183d29" font-family="Arial, sans-serif" font-size="16" font-weight="700">Tab Smart Rename</text><rect x="942" y="94" width="140" height="29" rx="15" fill="#f9faf7" stroke="#d4dfd6"/><text x="963" y="113" fill="#637268" font-family="Arial, sans-serif" font-size="12" font-weight="700">只在本机运行</text>
  <text x="640" y="204" text-anchor="middle" fill="#238459" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">安装完成</text><text x="640" y="280" text-anchor="middle" fill="#10271a" font-family="Georgia, serif" font-size="56" font-weight="700">给每个标签，</text><text x="640" y="340" text-anchor="middle" fill="#10271a" font-family="Georgia, serif" font-size="56" font-weight="700">一个一眼认出的名字。</text><text x="640" y="383" text-anchor="middle" fill="#65746a" font-family="Arial, sans-serif" font-size="17">在任意普通网页呼出全屏命名界面。没有拥挤的小窗口，也没有上传数据。</text>
  <rect x="367" y="426" width="546" height="74" rx="18" fill="#ffffffd9" stroke="#cbd9ce"/><text x="395" y="455" fill="#728078" font-family="Arial, sans-serif" font-size="12" font-weight="700">最快打开方式</text><text x="395" y="481" fill="#153d27" font-family="Arial, sans-serif" font-size="21" font-weight="700">⇧ ⌘ R</text><rect x="727" y="443" width="158" height="39" rx="10" fill="#fff" stroke="#b7c9ba"/><text x="754" y="468" fill="#176c45" font-family="Arial, sans-serif" font-size="13" font-weight="700">检查快捷键</text>
  <path d="M154 551h972" stroke="#d8e1da"/><text x="154" y="588" fill="#238459" font-family="Arial, sans-serif" font-size="12" font-weight="700">01</text><text x="194" y="587" fill="#153d27" font-family="Arial, sans-serif" font-size="15" font-weight="700">呼出界面</text><text x="194" y="611" fill="#6b786f" font-family="Arial, sans-serif" font-size="13">按快捷键，或点击扩展图标。</text><text x="502" y="588" fill="#238459" font-family="Arial, sans-serif" font-size="12" font-weight="700">02</text><text x="542" y="587" fill="#153d27" font-family="Arial, sans-serif" font-size="15" font-weight="700">输入名称</text><text x="542" y="611" fill="#6b786f" font-family="Arial, sans-serif" font-size="13">选择只保留在页面、标签或规则。</text><text x="850" y="588" fill="#238459" font-family="Arial, sans-serif" font-size="12" font-weight="700">03</text><text x="890" y="587" fill="#153d27" font-family="Arial, sans-serif" font-size="15" font-weight="700">回到工作</text><text x="890" y="611" fill="#6b786f" font-family="Arial, sans-serif" font-size="13">Enter 保存，Esc 随时关闭。</text>
  <path d="M154 653h972" stroke="#d8e1da"/><text x="154" y="691" fill="#78847c" font-family="Arial, sans-serif" font-size="12">受保护页面无法修改 · 默认不请求全站权限 · 无网络请求与遥测</text><rect x="967" y="670" width="159" height="44" rx="11" fill="#176c45"/><text x="1008" y="698" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700">开始使用 →</text>
</svg>
